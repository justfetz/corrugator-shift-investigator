[project]
name = "corrugator-shift-investigator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb==1.5.1", "reportlab==4.4.9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
investigator = ["web/*.html", "web/*.js", "web/*.css"]
