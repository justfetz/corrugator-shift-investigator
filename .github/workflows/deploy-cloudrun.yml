# Deploys main to Google Cloud Run as the public synthetic demo when the
# repository has a GCP_PROJECT_ID variable and a GCP_SA_KEY secret. No-op otherwise.
# Builds from source (Cloud Build uses the Dockerfile), scale-to-zero, two instances max.
name: Deploy Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: cloud-run-deploy
jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'corrugator-shift-investigator' }}
      EMBED_ORIGINS: ${{ vars.PUBLIC_DEMO_EMBED_ORIGINS || 'https://justfetz.github.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Resolve the service URL (PUBLIC_DEMO_ORIGIN)
        # An existing service keeps its real URL. A first deploy uses the deterministic
        # form as a provisional origin and is corrected after the service exists.
        run: |
          set -euo pipefail
          EXISTING=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)' 2>/dev/null || true)
          NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          echo "ORIGIN=${EXISTING:-https://${SERVICE}-${NUMBER}.${REGION}.run.app}" >> "$GITHUB_ENV"
      - name: Deploy from source
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" --source . --project "$PROJECT_ID" --region "$REGION" \
            --allow-unauthenticated --min-instances 0 --max-instances 2 --cpu 1 --memory 1Gi \
            --concurrency 20 --timeout 180 \
            --set-env-vars "PUBLIC_DEMO_ORIGIN=${ORIGIN},PUBLIC_DEMO_EMBED_ORIGINS=${EMBED_ORIGINS}" --quiet
      - name: Correct the origin if the real URL differs
        run: |
          set -euo pipefail
          ACTUAL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          if [ "$ACTUAL" != "$ORIGIN" ]; then
            echo "Service URL is $ACTUAL (provisional origin was $ORIGIN); updating PUBLIC_DEMO_ORIGIN"
            gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
              --update-env-vars "PUBLIC_DEMO_ORIGIN=${ACTUAL}" --quiet
            echo "ORIGIN=${ACTUAL}" >> "$GITHUB_ENV"
          fi
      - name: Smoke test
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/healthz.txt -w '%{http_code}' "$ORIGIN/healthz" || true)
          echo "GET $ORIGIN/healthz -> HTTP $CODE"
          cat /tmp/healthz.txt; echo
          test "$CODE" = "200"
          echo "Live at $ORIGIN"
