# Deploys main to Google Cloud Run as the public synthetic demo when the
# repository has a GCP_PROJECT_ID variable and a GCP_SA_KEY secret. No-op otherwise.
# Builds from source (Cloud Build uses the Dockerfile), scale-to-zero, two instances max.
name: Deploy Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency: cloud-run-deploy
jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'corrugator-shift-investigator' }}
      EMBED_ORIGINS: ${{ vars.PUBLIC_DEMO_EMBED_ORIGINS || 'https://justfetz.github.io' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Collect every URL the service answers on (PUBLIC_DEMO_ORIGIN allow-list)
        # Cloud Run gives a service a legacy "<service>-<hash>-<region code>.a.run.app" URL and, on
        # most projects, a deterministic "<service>-<project number>.<region>.run.app" one. Which of
        # them gcloud reports as status.url varies by version, so allow-list both: the server
        # accepts a comma-separated list and refuses POSTs from anything else.
        run: |
          set -euo pipefail
          NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          DETERMINISTIC="https://${SERVICE}-${NUMBER}.${REGION}.run.app"
          KNOWN=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json 2>/dev/null \
                  | python3 -c 'import json,sys,re; print(",".join(sorted(set(re.findall(r"https://[a-z0-9.-]+\.run\.app", json.dumps(json.load(sys.stdin).get("status", {})))))))' || true)
          ORIGINS="$DETERMINISTIC"; [ -n "$KNOWN" ] && ORIGINS="${KNOWN},${DETERMINISTIC}"
          echo "ORIGINS=${ORIGINS}" >> "$GITHUB_ENV"
          echo "allow-listing: ${ORIGINS}"
      - name: Deploy from source
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" --source . --project "$PROJECT_ID" --region "$REGION" \
            --allow-unauthenticated --min-instances 0 --max-instances 2 --cpu 1 --memory 1Gi \
            --concurrency 20 --timeout 180 \
            --set-env-vars "^|^PUBLIC_DEMO_ORIGIN=${ORIGINS}|PUBLIC_DEMO_EMBED_ORIGINS=${EMBED_ORIGINS}" --quiet
      - name: Add any URL the first deploy created to the allow-list
        run: |
          set -euo pipefail
          ALL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json \
                | python3 -c 'import json,sys,re; print(",".join(sorted(set(re.findall(r"https://[a-z0-9.-]+\.run\.app", json.dumps(json.load(sys.stdin).get("status", {})))))))')
          MERGED=$(python3 -c 'import sys; print(",".join(sorted(set(sys.argv[1].split(",")) | set(sys.argv[2].split(",")))))' "$ORIGINS" "$ALL")
          if [ "$MERGED" != "$(python3 -c 'import sys; print(",".join(sorted(set(sys.argv[1].split(",")))))' "$ORIGINS")" ]; then
            echo "new URL after deploy; allow-listing ${MERGED}"
            gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
              --update-env-vars "^|^PUBLIC_DEMO_ORIGIN=${MERGED}" --quiet
          fi
          echo "ORIGINS=${MERGED}" >> "$GITHUB_ENV"
      - name: Smoke test
        run: |
          set -euo pipefail
          LIVE=""
          for URL in $(echo "$ORIGINS" | tr ',' ' '); do
            CODE=$(curl -sS -o /tmp/healthz.txt -w '%{http_code}' --max-time 30 "$URL/healthz" || true)
            echo "GET $URL/healthz -> HTTP $CODE $(head -c 200 /tmp/healthz.txt 2>/dev/null)"
            [ "$CODE" = "200" ] && LIVE="$URL"
          done
          test -n "$LIVE"
          echo "Live at $LIVE"
