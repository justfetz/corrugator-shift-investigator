# Deploys main to Google Cloud Run as the public synthetic demo when the
# repository has a GCP_PROJECT_ID variable. No-op otherwise.
# Builds from source (Cloud Build uses the Dockerfile), scale-to-zero, two instances max.
#
# Keyless (issue #28): the job authenticates with Workload Identity Federation. GitHub mints a
# short-lived OIDC token for this run, Google exchanges it for the deployer service account's
# credentials, and nothing long-lived is stored anywhere. Repository VARIABLES (never secrets):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_DEPLOYER_SERVICE_ACCOUNT    github-deployer@<project>.iam.gserviceaccount.com
# Until both are set the job falls back to the GCP_SA_KEY secret and says so in a warning, so main
# stays deployable through the cutover. One-time setup, the cutover order and the key deletion are
# in docs/DEPLOYMENT.md; preview.yml carries the same credential block (tests/test_repo_hygiene.py).
name: Deploy Cloud Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # lets the run request the OIDC token that Workload Identity Federation exchanges
concurrency: cloud-run-deploy
jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'corrugator-shift-investigator' }}
      EMBED_ORIGINS: ${{ vars.PUBLIC_DEMO_EMBED_ORIGINS || 'https://justfetz.github.io' }}
      # Custom domains mapped to the service (Cloud Run domain mapping, set up by the owner). They are
      # appended to the allow-list so the analyst POST from https://shift.talktomymachine.ai is accepted.
      CUSTOM_ORIGINS: ${{ vars.PUBLIC_DEMO_CUSTOM_ORIGINS || 'https://shift.talktomymachine.ai' }}
      LIVE_MODEL: ${{ vars.PUBLIC_DEMO_LIVE_MODEL || '0' }}
      # Secret Manager secret NAMES (never values). Empty = that provider is not mounted.
      # Both providers are opt-in by naming their secret; an unset variable mounts nothing.
      # (OpenAI used to default to 'openai-api-key'; set OPENAI_SECRET_NAME to keep it.)
      OPENAI_SECRET: ${{ vars.OPENAI_SECRET_NAME || '' }}
      ANTHROPIC_SECRET: ${{ vars.ANTHROPIC_SECRET_NAME || '' }}
      # Hosted-demo guards (docs/ANTHROPIC_DEMO.md); empty keeps each guard off.
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || '' }}
      DEMO_RATE_LIMIT_PER_MIN: ${{ vars.DEMO_RATE_LIMIT_PER_MIN || '' }}
      DEMO_DAILY_CAP: ${{ vars.DEMO_DAILY_CAP || '' }}
      DEMO_MAX_TURNS: ${{ vars.DEMO_MAX_TURNS || '' }}
      # Rotates the shared session token (issue #17). Any string; empty derives the token from the demo origin.
      WORKBENCH_SECRET: ${{ vars.WORKBENCH_SECRET || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Changelog from the merged pull requests
        # /docs/changelog (issue #93) lists every merged pull request, this one included. Nothing here can
        # fail the deploy: the history fetch is inside this step, the step may fail (continue-on-error) or
        # time out, and the generator replaces the committed docs/CHANGELOG.md only with a complete list
        # (never fewer pull requests than it already holds), written atomically. Otherwise the committed file ships.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          git fetch --quiet --unshallow origin
          PYTHONPATH=src python3 -m investigator.docsite changelog
      - name: Choose the Google credential (keyless when the WIF variables are set; the stored key until then)
        id: gcp_auth
        # Workload Identity Federation when both repository variables are set. Otherwise the GCP_SA_KEY
        # secret, with a warning in the run's annotations, so main stays deployable through the cutover
        # (docs/DEPLOYMENT.md, 'Keyless deploy'). Neither available fails here with the instruction,
        # instead of inside the auth step with a generic error. The two auth steps below are the only
        # readers of a credential; this step learns whether the secret exists, never its value.
        env:
          HAVE_KEY: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          set -euo pipefail
          MISSING=""
          if [ -z "$WIF_PROVIDER" ]; then MISSING="GCP_WORKLOAD_IDENTITY_PROVIDER"; fi
          if [ -z "$DEPLOYER_SA" ]; then MISSING="${MISSING:+$MISSING and }GCP_DEPLOYER_SERVICE_ACCOUNT"; fi
          if [ -z "$MISSING" ]; then
            echo "mode=wif" >> "$GITHUB_OUTPUT"
            echo "deploying as ${DEPLOYER_SA} through ${WIF_PROVIDER}"
          elif [ "$HAVE_KEY" = "true" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
            echo "::warning::deploying with the stored GCP_SA_KEY secret (unset: ${MISSING}). Set the repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOYER_SERVICE_ACCOUNT to deploy keyless (docs/DEPLOYMENT.md, 'Keyless deploy'); once a run logs 'deploying as ... through ...', delete the secret and the key."
          else
            echo "::error::no Google credential (unset: ${MISSING}; no GCP_SA_KEY secret either). Set the repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOYER_SERVICE_ACCOUNT (docs/DEPLOYMENT.md, 'Keyless deploy')."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        if: steps.gcp_auth.outputs.mode == 'wif'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/auth@v2
        if: steps.gcp_auth.outputs.mode == 'key'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Collect every URL the service answers on (PUBLIC_DEMO_ORIGIN allow-list)
        # Cloud Run gives a service a legacy "<service>-<hash>-<region code>.a.run.app" URL and, on
        # most projects, a deterministic "<service>-<project number>.<region>.run.app" one. Which of
        # them gcloud reports as status.url varies by version, so allow-list both: the server
        # accepts a comma-separated list and refuses POSTs from anything else.
        run: |
          set -euo pipefail
          NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          DETERMINISTIC="https://${SERVICE}-${NUMBER}.${REGION}.run.app"
          KNOWN=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json 2>/dev/null \
                  | python3 -c 'import json,sys,re; print(",".join(sorted(set(re.findall(r"https://[a-z0-9.-]+\.run\.app", json.dumps(json.load(sys.stdin).get("status", {})))))))' || true)
          ORIGINS="$DETERMINISTIC"; [ -n "$KNOWN" ] && ORIGINS="${KNOWN},${DETERMINISTIC}"
          [ -n "${CUSTOM_ORIGINS:-}" ] && ORIGINS="${ORIGINS},${CUSTOM_ORIGINS}"
          echo "ORIGINS=${ORIGINS}" >> "$GITHUB_ENV"
          echo "allow-listing: ${ORIGINS}"
      - name: Deploy from source
        run: |
          set -euo pipefail
          # Live model: only when the repository variable PUBLIC_DEMO_LIVE_MODEL is "1". Keys are
          # never in GitHub; Cloud Run reads each from Secret Manager at start-up (OPENAI_API_KEY and/or
          # ANTHROPIC_API_KEY). A provider whose secret NAME variable is empty is simply not mounted.
          # The guards ride as plain env vars; TRUST_PROXY=1 because Cloud Run's front end sets
          # X-Forwarded-For (one trusted hop; the server takes the rightmost entry).
          ENV_VARS="^|^PUBLIC_DEMO_ORIGIN=${ORIGINS}|PUBLIC_DEMO_EMBED_ORIGINS=${EMBED_ORIGINS}|TRUST_PROXY=1"
          for pair in "ANTHROPIC_MODEL=${ANTHROPIC_MODEL}" "DEMO_RATE_LIMIT_PER_MIN=${DEMO_RATE_LIMIT_PER_MIN}" \
                      "DEMO_DAILY_CAP=${DEMO_DAILY_CAP}" "DEMO_MAX_TURNS=${DEMO_MAX_TURNS}" "WORKBENCH_SECRET=${WORKBENCH_SECRET}"; do
            [ -n "${pair#*=}" ] && ENV_VARS="${ENV_VARS}|${pair}"
          done
          if [ "$LIVE_MODEL" = "1" ]; then
            # Mount only the secrets that actually exist in the project; a named-but-missing secret
            # is a loud warning, not a failed deploy, so the first live deploy can land before every
            # provider is provisioned. OpenAI keeps its historical default name.
            SECRETS=""
            for pair in "OPENAI_API_KEY=${OPENAI_SECRET}" "ANTHROPIC_API_KEY=${ANTHROPIC_SECRET}"; do
              name="${pair#*=}"; [ -z "$name" ] && continue
              # The deployer account may lack secretmanager.viewer (it only ever needed to deploy).
              # Treat PERMISSION_DENIED as "probably exists" and mount; only a definite NOT_FOUND skips.
              if out=$(gcloud secrets describe "$name" --project "$PROJECT_ID" 2>&1); then
                SECRETS="${SECRETS:+${SECRETS},}${pair}:latest"; echo "mounting ${pair%%=*} from secret ${name}"
              elif echo "$out" | grep -qiE "PERMISSION_DENIED|permission"; then
                SECRETS="${SECRETS:+${SECRETS},}${pair}:latest"
                echo "::warning::cannot read metadata of secret '${name}' (deployer lacks roles/secretmanager.viewer); mounting it anyway — the deploy fails here if it does not exist"
              else
                echo "::warning::secret '${name}' not found in ${PROJECT_ID}; ${pair%%=*} will not be mounted"
              fi
            done
            if [ -n "$SECRETS" ]; then
              LIVE_FLAGS=(--set-secrets "$SECRETS"); ENV_VARS="${ENV_VARS}|PUBLIC_DEMO_LIVE_MODEL=1"
            else
              echo "::warning::PUBLIC_DEMO_LIVE_MODEL=1 but no provider secret exists yet; deploying offline-only"
              LIVE_FLAGS=(--clear-secrets); ENV_VARS="${ENV_VARS}|PUBLIC_DEMO_LIVE_MODEL=0"; LIVE_MODEL=0; echo "LIVE_MODEL=0" >> "$GITHUB_ENV"
            fi
          else
            LIVE_FLAGS=(--clear-secrets)   # the service holds no other secrets; idempotent when none exist
            ENV_VARS="${ENV_VARS}|PUBLIC_DEMO_LIVE_MODEL=0"
          fi
          # The revision is named here so the traffic step below can route to it BY NAME: a preview
          # (preview.yml) can create a newer revision at any moment, so "latest" is not this deploy.
          # The write goes through .github/scripts/cloud_run_update.sh: Cloud Run rejects it when
          # another run changed the service in the second between gcloud's re-read after the build
          # and its write, and the helper then runs the deploy again instead of failing main.
          # Cloud Run caps a revision name at 63 characters (a service name at 49), so the suffix is sized to
          # what the service name leaves, minus the "-urls" the allow-list step may append: the run number and
          # attempt stay whole (they make the name unique per run and per re-run), the commit is shortened,
          # and a service name that leaves no room at all fails here with the limit named, not in the API.
          TAIL="-${{ github.run_number }}-${{ github.run_attempt }}"
          SHA_LEN=$(( 63 - ${#SERVICE} - 1 - 5 - ${#TAIL} - 5 )); [ "$SHA_LEN" -gt 7 ] && SHA_LEN=7
          if [ "$SHA_LEN" -lt 1 ]; then echo "::error::the service name $SERVICE (${#SERVICE} characters) leaves no room for a revision suffix inside Cloud Run's 63-character revision name"; exit 1; fi
          SUFFIX="main-${GITHUB_SHA:0:$SHA_LEN}${TAIL}"
          echo "SUFFIX=${SUFFIX}" >> "$GITHUB_ENV"; echo "REVISION=${SERVICE}-${SUFFIX}" >> "$GITHUB_ENV"
          bash .github/scripts/cloud_run_update.sh gcloud run deploy "$SERVICE" --source . --project "$PROJECT_ID" --region "$REGION" \
            --allow-unauthenticated --min-instances 0 --max-instances 2 --cpu 1 --memory 1Gi \
            --concurrency 20 --timeout 180 --revision-suffix "$SUFFIX" \
            --set-env-vars "$ENV_VARS" "${LIVE_FLAGS[@]}" --quiet
      - name: Add any URL the first deploy created to the allow-list
        run: |
          set -euo pipefail
          ALL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json \
                | python3 -c 'import json,sys,re; print(",".join(sorted(set(re.findall(r"https://[a-z0-9.-]+\.run\.app", json.dumps(json.load(sys.stdin).get("status", {})))))))')
          MERGED=$(python3 -c 'import sys; print(",".join(sorted(set(sys.argv[1].split(",")) | set(sys.argv[2].split(",")))))' "$ORIGINS" "$ALL")
          if [ "$MERGED" != "$(python3 -c 'import sys; print(",".join(sorted(set(sys.argv[1].split(",")))))' "$ORIGINS")" ]; then
            echo "new URL after deploy; allow-listing ${MERGED}"
            # This makes one more revision; it is named too, and it is the one the traffic step routes to.
            # The update builds from the service's CURRENT template; a preview deploy landing in between would put
            # the PR's image there. Pin the image to the revision this run just deployed, so by-name routing below
            # can only ever route production to main's own build.
            bash .github/scripts/cloud_run_update.sh gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
              --update-env-vars "^|^PUBLIC_DEMO_ORIGIN=${MERGED}" --revision-suffix "${SUFFIX}-urls" \
              --image "$(gcloud run revisions describe "${SERVICE}-${SUFFIX}" --project "$PROJECT_ID" --region "$REGION" --format='value(spec.containers[0].image)')" --quiet
            echo "REVISION=${SERVICE}-${SUFFIX}-urls" >> "$GITHUB_ENV"
          fi
          echo "ORIGINS=${MERGED}" >> "$GITHUB_ENV"
      - name: Route all traffic to the revision just deployed
        # A pull-request preview (preview.yml) deploys with --no-traffic, and gcloud documents the
        # side effect: from then on the service's traffic is pinned to a NAMED revision and later
        # deploys without a traffic flag get 0%. main must always take the traffic, so bind it to
        # the revision this run named, and check. Not --to-latest: LATEST follows whichever revision
        # became ready last, and a preview can land between the deploy above and this step (the
        # runs are not serialized), which would have put production's traffic on a pull request's
        # revision until the next deploy of main. Tags on other PRs' previews are untouched
        # (percentages only).
        run: |
          set -euo pipefail
          bash .github/scripts/cloud_run_update.sh gcloud run services update-traffic "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --to-revisions "${REVISION}=100" --quiet
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format=json \
            | python3 -c 'import json,sys; t=json.load(sys.stdin)["status"]["traffic"]; print(t); assert any(x.get("revisionName")==sys.argv[1] and x.get("percent")==100 for x in t), sys.argv[1]+" does not carry 100% of the traffic"' "$REVISION"
      - name: Smoke test
        run: |
          set -euo pipefail
          LIVE=""
          for URL in $(echo "$ORIGINS" | tr ',' ' '); do
            CODE=$(curl -sS -o /tmp/healthz.txt -w '%{http_code}' --max-time 30 "$URL/api/health" || true)
            echo "GET $URL/api/health -> HTTP $CODE $(head -c 200 /tmp/healthz.txt 2>/dev/null)"
            [ "$CODE" = "200" ] && LIVE="$URL"
          done
          test -n "$LIVE"
          CFG=$(curl -sS --max-time 30 "$LIVE/api/config")
          echo "live modes: $(echo "$CFG" | python3 -c 'import json,sys; c=json.load(sys.stdin); print(c.get("live_modes") or c.get("live_model_available"))')"
          if [ "$LIVE_MODEL" = "1" ]; then echo "$CFG" | python3 -c 'import json,sys; c=json.load(sys.stdin); sys.exit(0 if (c.get("live_modes") or c.get("live_model_available")) else 1)'; fi
          echo "Live at $LIVE"
