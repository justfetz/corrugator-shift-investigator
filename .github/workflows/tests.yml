name: Tests
# workflow_dispatch: the agent workflow starts Tests on an agent's branch, since its GITHUB_TOKEN pushes start
# no workflow (agent.yml, issue #126); the run's `deterministic` check lands on the branch's head commit.
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    # A shared runner is slow in bursts, so each golden case's own budget and every speed budget a test asserts are
    # tripled here (evals/run.py latency_budget, issue #139; 2 was not enough: docs/TESTING.md). The offline p50 / p95
    # gate (100 / 250 ms) is never scaled.
    env:
      INVESTIGATOR_LATENCY_SCALE: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: node --check src/investigator/web/app.js
      - run: node tests/test_ui.cjs
